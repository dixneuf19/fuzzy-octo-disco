[project]
name = "fuzzy-octo-disco"
version = "0.1.0"
description = "Face detection microservice used by dank-face-bot"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "dlib==20.0.1",
    "face-recognition==1.3.0",
    "fastapi>=0.135",
    "loguru>=0.7",
    "numpy>=2.3",
    "path>=16.16,<17",
    "pillow>=13",
    "uvicorn>=0.43",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9",
    "matplotlib>=3.10",
    "pytest>=9",
    "pytest-cov>=7",
]

[tool.uv]
package = false
exclude-newer = "3 days"

# face_recognition_models imports pkg_resources without declaring setuptools
[[tool.uv.dependency-metadata]]
name = "face-recognition-models"
version = "0.3.0"
requires-dist = ["setuptools<81"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["fuzzyoctodisco/test"]
