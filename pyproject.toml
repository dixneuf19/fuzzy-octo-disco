[project]
name = "fuzzy-octo-disco"
version = "0.1.0"
description = "Face detection microservice used by dank-face-bot"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.135",
    "loguru>=0.7",
    "numpy>=2.3",
    "opencv-python-headless>=5",
    "path>=16.16,<17",
    "pillow>=13",
    "uvicorn>=0.43",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9",
    "matplotlib>=3.10",
    "pytest>=9",
    "pytest-cov>=7",
]

[tool.uv]
package = false
exclude-newer = "3 days"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["fuzzyoctodisco/test"]
